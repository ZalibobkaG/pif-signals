# Настройки бота. Секреты (ключи, токены) хранятся отдельно, в .env.
# В Docker файл монтируется в контейнер: после правки достаточно перезапуска, пересборка не нужна.

trading:
  # Баланс (USDT), от которого считается риск на сделку
  balance: 200

backup:
  # Как часто сохранять состояние сделок, секунд
  interval_seconds: 1000
  # Сколько последних бэкапов хранить в logs/backups
  max_files: 100

ai:
  # Любой OpenAI-совместимый API
  base_url: https://api.deepseek.com
  model: deepseek-chat
